name: tribe365_new
description: "A new Flutter tribe365_new."
publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: '>=3.2.1 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  provider: ^6.1.5
  connectivity_plus: ^6.1.4
  dio: ^5.8.0+1
  http: ^1.4.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  fluttertoast: ^8.2.3
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  flutter_slidable: ^4.0.0
  fl_chart: ^1.0.0
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.2
  flutter_local_notifications: ^19.2.1
  path_provider: ^2.1.2
  firebase_crashlytics: ^4.0.2
  firebase_analytics: ^11.1.0
  firebase_auth: ^5.1.1
  permission_handler: ^11.1.0
  device_info_plus: ^11.4.0
  image_picker: ^1.0.7
  syncfusion_flutter_pdfviewer: ^29.2.10
  youtube_player_flutter: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5


flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/language/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto.ttf
          weight: 400
        - asset: assets/fonts/roboto_bold.ttf
          weight: 700
        - asset: assets/fonts/roboto_medium.ttf
          weight: 500
        - asset: assets/fonts/roboto_semibold.ttf
          weight: 600





